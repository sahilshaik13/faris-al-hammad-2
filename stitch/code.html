<script>
  (() => {
    const viewport = document.querySelector("[data-carousel-viewport]");
    const track = document.querySelector("[data-carousel-track]");
    if (!viewport || !track) return;

    const originals = Array.from(track.children);
    const originalCount = originals.length;
    if (!originalCount) return;

    // Clone both sides for seamless infinite loop.
    originals.forEach((item) => {
      const clone = item.cloneNode(true);
      clone.setAttribute("aria-hidden", "true");
      track.appendChild(clone);
    });
    originals.slice().reverse().forEach((item) => {
      const clone = item.cloneNode(true);
      clone.setAttribute("aria-hidden", "true");
      track.insertBefore(clone, track.firstChild);
    });

    let index = originalCount;
    let step = 0;
    let currentX = 0;
    let isDragging = false;
    let startX = 0;
    let startTranslate = 0;
    let wheelLock = false;

    function computeStep() {
      const first = track.children[0];
      if (!first) return;
      const styles = window.getComputedStyle(track);
      const gap = parseFloat(styles.columnGap || styles.gap || "0");
      step = first.getBoundingClientRect().width + gap;
      currentX = -index * step;
      track.style.transition = "none";
      track.style.transform = `translate3d(${currentX}px, 0, 0)`;
      requestAnimationFrame(() => {
        track.style.transition = "transform 380ms cubic-bezier(0.22, 0.61, 0.36, 1)";
      });
      updateActive();
    }

    function normalizeIndex() {
      if (index >= originalCount * 2) {
        index -= originalCount;
        track.style.transition = "none";
        currentX = -index * step;
        track.style.transform = `translate3d(${currentX}px, 0, 0)`;
        requestAnimationFrame(() => {
          track.style.transition = "transform 380ms cubic-bezier(0.22, 0.61, 0.36, 1)";
        });
      } else if (index < originalCount) {
        index += originalCount;
        track.style.transition = "none";
        currentX = -index * step;
        track.style.transform = `translate3d(${currentX}px, 0, 0)`;
        requestAnimationFrame(() => {
          track.style.transition = "transform 380ms cubic-bezier(0.22, 0.61, 0.36, 1)";
        });
      }
    }

    function updateActive() {
      const all = Array.from(track.children);
      all.forEach((item) => item.classList.remove("is-active"));
      const active = all[index];
      if (active) active.classList.add("is-active");
    }

    function snapTo(i) {
      index = i;
      currentX = -index * step;
      track.style.transform = `translate3d(${currentX}px, 0, 0)`;
      updateActive();
    }

    function next() {
      snapTo(index + 1);
    }

    function prev() {
      snapTo(index - 1);
    }

    track.addEventListener("transitionend", () => {
      normalizeIndex();
      updateActive();
    });

    viewport.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        if (wheelLock) return;
        const dominant = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (Math.abs(dominant) < 8) return;
        wheelLock = true;
        dominant > 0 ? next() : prev();
        setTimeout(() => {
          wheelLock = false;
        }, 220);
      },
      { passive: false }
    );

    viewport.addEventListener("pointerdown", (e) => {
      isDragging = true;
      startX = e.clientX;
      startTranslate = currentX;
      track.style.transition = "none";
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      currentX = startTranslate + dx;
      track.style.transform = `translate3d(${currentX}px, 0, 0)`;
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      viewport.releasePointerCapture(e.pointerId);
      const moved = currentX - startTranslate;
      track.style.transition = "transform 380ms cubic-bezier(0.22, 0.61, 0.36, 1)";
      if (moved < -step * 0.18) {
        next();
      } else if (moved > step * 0.18) {
        prev();
      } else {
        snapTo(index);
      }
    }

    viewport.addEventListener("pointerup", endDrag);
    viewport.addEventListener("pointercancel", endDrag);

    window.addEventListener("resize", computeStep);
    computeStep();
  })();
</script>
